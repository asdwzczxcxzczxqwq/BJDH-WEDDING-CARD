<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>사진 보기</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#f7f6f4;
  font-family:'Noto Serif KR', serif;
  color:#222;
}

.wrap{
  max-width:600px;
  margin:auto;
  padding:20px;
}

/* 상단 */
.top{
  text-align:center;
  margin-bottom:20px;
}

.back{
  display:inline-block;
  margin-bottom:10px;
  color:#666;
  text-decoration:none;
  font-size:14px;
}

.title{
  font-size:22px;
  font-weight:600;
}

/* 카드 */
.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

/* 메인 슬라이드 */
.viewer{
  position:relative;
  background:#eee;
}

.viewer img{
  width:100%;
  height:420px;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

/* 상단 카운트 */
.count{
  position:absolute;
  top:12px;
  right:12px;
  background:rgba(255,255,255,0.9);
  border:1px solid #ddd;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

/* 좌우 버튼 */
.navbtn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:44px;
  height:44px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.7);
  background:rgba(0,0,0,0.35);
  color:#fff;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
}
.navbtn:active{ transform:translateY(-50%) scale(0.98); }
.prev{ left:12px; }
.next{ right:12px; }

/* 썸네일 */
.thumbs{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  padding:14px;
}

.thumb{
  border-radius:12px;
  overflow:hidden;
  border:1px solid #ddd;
  background:#eee;
  cursor:pointer;
}

.thumb img{
  width:100%;
  height:110px;
  object-fit:cover;
  display:block;
  opacity:0.92;
}
.thumb.on img{
  opacity:1;
}
.thumb.on{
  border-color:#111;
}

/* 안내 */
.tip{
  padding:0 14px 14px;
  font-size:13px;
  color:#888;
  text-align:center;
}

/* 라이트박스(확대) */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.86);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:18px;
}
.lightbox.on{ display:flex; }

.lb-inner{
  width:100%;
  max-width:900px;
  position:relative;
}

.lb-img{
  width:100%;
  max-height:85vh;
  object-fit:contain;
  display:block;
  border-radius:14px;
  background:#000;
}

/* 라이트박스 닫기 */
.lb-close{
  position:absolute;
  top:-10px;
  right:-10px;
  width:42px;
  height:42px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.35);
  background:rgba(255,255,255,0.12);
  color:#fff;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* footer */
.footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">← 메인으로</a>
    <div class="title">사진 보기</div>
  </div>

  <div class="card">

    <!-- 슬라이드 뷰어 -->
    <div class="viewer" id="viewer">
      <img id="mainImg" src="images/1.jpg" alt="갤러리" />
      <div class="count" id="count">1 / 6</div>
      <div class="navbtn prev" id="prevBtn">‹</div>
      <div class="navbtn next" id="nextBtn">›</div>
    </div>

    <!-- 썸네일 -->
    <div class="thumbs" id="thumbs"></div>

    <div class="tip">사진을 <b>좌우로 스와이프</b>하거나, 사진을 눌러 <b>확대</b>할 수 있어요.</div>
  </div>

</div>

<!-- 확대(라이트박스) -->
<div class="lightbox" id="lightbox">
  <div class="lb-inner">
    <img class="lb-img" id="lbImg" src="" alt="확대보기">
    <div class="lb-close" id="lbClose">×</div>
  </div>
</div>

<script>
/** ✅ 여기에 사진 목록만 맞춰주면 끝 */
const images = [
  "images/1.jpg",
  "images/2.jpg",
  "images/3.jpg",
  "images/4.jpg",
  "images/5.jpg",
  "images/6.jpg"
];

let idx = 0;

const mainImg = document.getElementById('mainImg');
const count = document.getElementById('count');
const thumbs = document.getElementById('thumbs');

function renderThumbs(){
  thumbs.innerHTML = "";
  images.forEach((src, i)=>{
    const div = document.createElement('div');
    div.className = "thumb" + (i === idx ? " on" : "");
    div.innerHTML = `<img src="${src}" alt="thumb ${i+1}">`;
    div.addEventListener('click', ()=> setIndex(i));
    thumbs.appendChild(div);
  });
}

function setIndex(i){
  idx = (i + images.length) % images.length;
  mainImg.src = images[idx];
  count.textContent = `${idx+1} / ${images.length}`;
  renderThumbs();
}

document.getElementById('prevBtn').addEventListener('click', ()=> setIndex(idx - 1));
document.getElementById('nextBtn').addEventListener('click', ()=> setIndex(idx + 1));

/* 스와이프 */
let startX = null;
const viewer = document.getElementById('viewer');

viewer.addEventListener('touchstart', (e)=>{
  startX = e.touches[0].clientX;
}, {passive:true});

viewer.addEventListener('touchend', (e)=>{
  if(startX === null) return;
  const endX = e.changedTouches[0].clientX;
  const diff = endX - startX;
  if(Math.abs(diff) > 40){
    diff > 0 ? setIndex(idx - 1) : setIndex(idx + 1);
  }
  startX = null;
});

/* 확대(라이트박스) */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');

function openLightbox(){
  lbImg.src = images[idx];
  lightbox.classList.add('on');
}
function closeLightbox(){
  lightbox.classList.remove('on');
  lbImg.src = "";
}

mainImg.addEventListener('click', openLightbox);
document.getElementById('lbClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e)=>{
  if(e.target === lightbox) closeLightbox();
});

/* 키보드(PC) */
window.addEventListener('keydown', (e)=>{
  if(lightbox.classList.contains('on')){
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') setIndex(idx - 1);
    if(e.key === 'ArrowRight') setIndex(idx + 1);
  }
});

/* 초기 렌더 */
setIndex(0);
</script>

</body>
</html>
